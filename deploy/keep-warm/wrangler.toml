name = "minerva-keep-warm"
main = "worker.js"
compatibility_date = "2026-08-13"

# Keep the Render free web service awake for the 19:00 reminder cron
# (17:45-20:00) and for morning users (09:00-12:00). ~163h/month awake,
# well under Render's 750 free instance-hours cap.
[triggers]
crons = ["*/5 9-11,18-19 * * *", "45-59/5 17 * * *"]
